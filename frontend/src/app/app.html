<app-shell title="Homelab Monitor" subtitle="Services & infrastructure health">
  <ui-stack size="lg">
    @if (isLoading()) {
      <ui-text variant="muted">Loading VMs and services…</ui-text>
    } @else if (error()) {
      <ui-text variant="muted">{{ error() }}</ui-text>
    } @else if (hasDashboardItems()) {
      <app-dashboard-stats [machines]="machines()" [allServices]="allServices()"/>
      <app-machines-overview [machines]="machines()" (machineSelected)="setMachineFilter($event)"/>
      <app-services-table 
        [machines]="machines()" [allServices]="allServices()"
        [selectedMachine]="machineFilter()"
        (machineSelected)="setMachineFilter($event)"
        (logsRequested)="openLogs($event)"
      />
    } @else {
      <ui-text variant="muted">No Machines or services found.</ui-text>
    }
  </ui-stack>
</app-shell>

@if (logDrawerService()) {
  <app-logs-drawer [service]="logDrawerService()" (logsClosed)="closeLogs()"/>
}

<router-outlet />
