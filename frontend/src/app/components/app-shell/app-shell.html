<ui-box variant="page">
  <div class="flex min-h-dvh flex-col">
    <ui-box variant="surface" border="bottom">
      <ui-container>
        <ui-hstack justify="between">
          <div class="py-4">
            <ui-stack size="xs">
              <ui-title>{{ heading() }}</ui-title>
              <ui-text size="sm" variant="muted">{{ subtitle() }}</ui-text>
            </ui-stack>
          </div>

          <ui-text size="sm" variant="muted">Local dashboard</ui-text>
        </ui-hstack>
      </ui-container>
    </ui-box>

    <main class="flex-1 py-6">
      <ui-container>
        <ng-content />
      </ui-container>
    </main>

    <ui-box variant="surface" border="top" padding="sm">
      <ui-container>
        <ui-text size="sm" variant="muted">Homelab Monitor</ui-text>
      </ui-container>
    </ui-box>
  </div>
</ui-box>
