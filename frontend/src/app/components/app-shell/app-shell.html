<ui-box variant="page">

    <ui-box variant="surface" border="bottom">
      <ui-container>
        <ui-hstack justify="between">
          <div class="py-4">
            <ui-stack size="xs">
              <h1 class="text-lg font-semibold">{{ title() }}</h1>
              <p class="text-sm text-muted-foreground">{{ subtitle() }}</p>
            </ui-stack>
          </div>

          <p class="text-sm text-muted-foreground">Local dashboard</p>
        </ui-hstack>
      </ui-container>
    </ui-box>

    <main class="flex-1 py-6">
      <ui-container>
        <ng-content />
      </ui-container>
    </main>

    <ui-box variant="surface" border="top" padding="sm">
      <ui-container>
        <p class="text-sm text-muted-foreground">Homelab Monitor</p>
      </ui-container>
    </ui-box>
  </div>
