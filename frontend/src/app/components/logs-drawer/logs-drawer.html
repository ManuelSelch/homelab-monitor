<aside class="fixed right-0 top-0 z-50 flex h-dvh w-full max-w-2xl flex-col border-l bg-card shadow-2xl">
    <div class="flex items-start justify-between gap-4 border-b p-4">
        <div>
        <ui-title order="2">Logs: {{ service()!.name }}</ui-title>
        <ui-text size="sm" variant="muted">{{ service()!.machineName }} · {{ service()!.type }}</ui-text>
        </div>
        <button class="rounded-md border px-3 py-1.5 text-sm font-medium hover:bg-muted" type="button" (click)="closeLogs()">Close</button>
    </div>

    <div class="flex items-center justify-between border-b p-4">
        <ui-badge [variant]="badgeForStatus(service()!.status)">{{ service()!.status }}</ui-badge>
        <button class="rounded-md border px-3 py-1.5 text-sm font-medium hover:bg-muted" type="button" (click)="refreshLogs()">Refresh</button>
    </div>

    <div class="min-h-0 flex-1 overflow-auto bg-background p-4">
        @if (logsLoading()) {
            <p class="text-sm text-slate-400">Loading logs…</p>
        } @else if (logsError()) {
            <p class="text-sm text-red-500">{{ logsError() }}</p>
        } @else {
            <pre class="whitespace-pre-wrap wrap-break-word font-mono text-xs leading-relaxed">{{ logs() }}</pre>
        }
    </div>
</aside>
