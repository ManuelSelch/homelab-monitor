<section class="rounded-xl border bg-card p-4 shadow-sm">
    <ui-stack>
        <div class="flex flex-col gap-1">
        <ui-title order="2">Machines</ui-title>
        <ui-text size="sm" variant="muted">Compact overview grouped by machine.</ui-text>
        </div>

        <div class="grid gap-3 md:grid-cols-2 xl:grid-cols-3">
        @for (machine of machines(); track machine.id) {
            <button
            type="button"
            class="rounded-lg border p-3 text-left transition hover:border-primary hover:bg-muted/50"
            (click)="selectMachine(machine.id)"
            >
            <div class="flex items-start justify-between gap-3">
                <div>
                <p class="font-medium">{{ machine.name }}</p>
                <ui-text size="sm" variant="muted">
                    {{ machine.services.length }} service{{ machine.services.length === 1 ? '' : 's' }}
                </ui-text>
                </div>
                <ui-badge [variant]="badgeForStatus(machine.status)">{{ machine.status }}</ui-badge>
            </div>
            </button>
        }
        </div>
    </ui-stack>
</section>
