<section class="rounded-xl border bg-card p-4 shadow-sm">
    <ui-stack>
        <div class="flex flex-col gap-1">
        <ui-title order="2">Machines</ui-title>
        <ui-text size="sm" variant="muted">Compact overview grouped by machine.</ui-text>
        </div>

        <div class="grid gap-3 md:grid-cols-2 xl:grid-cols-3">
        @for (machine of machines(); track machine.id) {
            <app-machine-card [machine]="machine" (machineClicked)="selectMachine(machine.id)" [isSelected]="machine.id === currentMachine()"/>
        }
        </div>
    </ui-stack>
</section>
