<ui-grid columns="4">
    <ui-box preset="card">
        <ui-text size="sm" variant="muted">Machines</ui-text>
        <ui-title size="lg">{{ machines().length }}</ui-title>
    </ui-box>
    <ui-box preset="card">
        <ui-text size="sm" variant="muted">Services</ui-text>
        <ui-title size="lg">{{ allServices().length }}</ui-title>
    </ui-box>
    <ui-box preset="card">
        <ui-text size="sm" variant="muted">Warnings</ui-text>
        <ui-title size="lg" variant="warning">{{ serviceCountByStatus("warning") }}</ui-title>
    </ui-box>
    <ui-box preset="card">
        <ui-text size="sm" variant="muted">Offline</ui-text>
        <ui-title size="lg" variant="danger">{{ serviceCountByStatus("offline") }}</ui-title>
    </ui-box>
</ui-grid>
