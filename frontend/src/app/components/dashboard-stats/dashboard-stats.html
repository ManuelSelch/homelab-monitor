<section class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
<div class="rounded-xl border bg-card p-4 shadow-sm">
    <ui-text size="sm" variant="muted">Machines</ui-text>
    <p class="mt-1 text-2xl font-semibold">{{ machines().length }}</p>
</div>
<div class="rounded-xl border bg-card p-4 shadow-sm">
    <ui-text size="sm" variant="muted">Services</ui-text>
    <p class="mt-1 text-2xl font-semibold">{{ allServices().length }}</p>
</div>
<div class="rounded-xl border bg-card p-4 shadow-sm">
    <ui-text size="sm" variant="muted">Warnings</ui-text>
    <p class="mt-1 text-2xl font-semibold text-yellow-700">{{ serviceCountByStatus("warning") }}</p>
</div>
<div class="rounded-xl border bg-card p-4 shadow-sm">
    <ui-text size="sm" variant="muted">Offline</ui-text>
    <p class="mt-1 text-2xl font-semibold text-red-700">{{ serviceCountByStatus("offline") }}</p>
</div>
</section>
