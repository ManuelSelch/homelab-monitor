spring.application.name=homelab-backend
springdoc.swagger-ui.path=/api

# Set proxmox.enabled=true and provide credentials to load real Proxmox data.
proxmox.enabled=true
proxmox.base-url=https://proxmox.homelab.local/api2/json
proxmox.node=pve
proxmox.api-token=${PROXMOX_API_TOKEN:}
proxmox.insecure-ssl=true

loki.base-url=http://localhost:3100